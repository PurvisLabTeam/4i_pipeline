[project]
name = "4i-pipeline"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "affinder>=0.5.0",
    "anndata>=0.12.19",
    "cellpose>=4.2.1.1",
    "dask>=2026.8.0",
    "delve-fs",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "magicgui>=0.10.2",
    "matplotlib>=3.11.2",
    "napari[pyqt6]>=0.9.2",
    "nd2>=0.12.0",
    "numpy>=2.5.4",
    "pandas>=2.3.3",
    "phate>=2.0.0",
    "plotly>=7.1.0",
    "pystackreg>=0.2.8",
    "python-pptx>=1.0.2",
    "scanpy>=1.11.1",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.5.2",
    "scipy>=1.17.1",
    "scprep>=1.1.0",
    "seaborn>=0.13.2",
    "sketchkh>=0.1.4",
    "statsmodels>=0.15.0",
    "tifffile>=2026.10.15",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "umap-learn>=0.5.12",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
delve-fs = { git = "https://github.com/omar-merhebi/delve", rev = "v0.1.7+purvislab.1" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
